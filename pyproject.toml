[project]
name = "radar-vagas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "flask>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
radar-vagas = "radar_vagas.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Sem isto o Pyright resolve contra o Python do sistema e acusa
# "Import could not be resolved" para requests, pytest e os módulos locais.
[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]
